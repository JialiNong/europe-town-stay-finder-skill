<style>
/* Layout: one reading column, departure-board time rows, piste-colour difficulty tags */
:root{
  --bg:#f2f5f7; --surface:#ffffff; --ink:#15212b; --muted:#5a6a77; --line:#d6dee4;
  --glacier:#1f5f8f; --glacier-soft:#e3eef6;
  --piste-green:#2e7d4f; --piste-blue:#1f5f8f; --piste-red:#c0392b;
  --bad:#b03a2e;
  --f-display:"Noto Serif SC","Songti SC",serif;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f161c; --surface:#16212a; --ink:#e6edf2; --muted:#93a4b2; --line:#2a3946;
  --glacier:#7cb6e3; --glacier-soft:#1b2d3c;
  --piste-green:#5cc58a; --piste-blue:#7cb6e3; --piste-red:#ef7a6c;
  --bad:#ef7a6c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161c; --surface:#16212a; --ink:#e6edf2; --muted:#93a4b2; --line:#2a3946;
  --glacier:#7cb6e3; --glacier-soft:#1b2d3c;
  --piste-green:#5cc58a; --piste-blue:#7cb6e3; --piste-red:#ef7a6c;
  --bad:#ef7a6c; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7}
.wrap{max-width:760px;margin:0 auto;padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:28px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:clamp(26px,6vw,36px);font-weight:900}
h2{font-size:21px}
h3{font-size:18px}
p{margin:0}
a{color:var(--glacier)}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:500}
.muted{color:var(--muted)}
.small{font-size:13px}

header{display:flex;flex-direction:column;gap:10px}
.route-line{font-size:14px;color:var(--muted)}
.route-line b{color:var(--ink)}

.verdict{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:14px}
.verdict ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:8px}
.alert{background:var(--glacier-soft);color:var(--ink);border-radius:8px;padding:12px 14px;font-size:14px}

.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:560px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:500;color:var(--muted);font-size:12px;letter-spacing:.06em}
td.num{font-family:var(--f-data);font-variant-numeric:tabular-nums;white-space:nowrap}
td.best{color:var(--piste-green);font-weight:600}

.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;white-space:nowrap}
.tag i{width:10px;height:10px;display:inline-block;transform:rotate(45deg)}
.tag.green i{background:var(--piste-green);border-radius:50%;transform:none}
.tag.blue i{background:var(--piste-blue)}

section.route{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:16px}
.route-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;align-items:baseline}
.route-head .total{font-family:var(--f-data);font-size:20px;font-weight:600;white-space:nowrap}
.pick{font-size:12px;background:var(--glacier-soft);color:var(--glacier);border-radius:999px;padding:2px 10px;font-weight:500;align-self:flex-start}

.legs{display:flex;flex-direction:column;border-left:2px solid var(--line);margin-left:6px}
.leg{position:relative;padding:0 0 14px 18px;display:flex;flex-direction:column;gap:2px}
.leg::before{content:"";position:absolute;left:-6px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--glacier)}
.leg.stay::before{border-color:var(--muted);background:var(--muted)}
.leg:last-child{padding-bottom:0}
.leg .t{font-family:var(--f-data);font-weight:600;font-variant-numeric:tabular-nums}
.leg .what{font-size:13px;color:var(--muted)}

.buy{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;font-size:14px;align-items:baseline}
.buy .p{font-family:var(--f-data);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.buy .where{font-size:13px;color:var(--muted)}
.buy .total-row{border-top:1px solid var(--line);padding-top:6px;font-weight:700}

.notes{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;font-size:14px}
.notes li.risk::marker{color:var(--bad)}
.block-title{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:500;margin-bottom:6px}

.excluded{display:flex;flex-direction:column;gap:12px}
.ex{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:4px}

footer{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:16px}
footer ul{margin:0;padding-left:1.2em}
.tag.red i{background:var(--piste-red)}
.render-error{background:var(--surface);border:1px solid var(--bad);color:var(--bad);border-radius:10px;padding:16px;font-family:var(--f-data);font-size:13px;white-space:pre-wrap}

/* ---- europe-town-stay-finder additions ---- */
.budget{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted)}
.budget b{font-family:var(--f-data);color:var(--ink);font-weight:600}
h2.sec{margin-bottom:10px}
.core-row td:first-child{font-weight:700}
.core-mark{font-size:11px;color:var(--glacier);background:var(--glacier-soft);border-radius:999px;padding:1px 8px;margin-left:6px;font-weight:500;white-space:nowrap}
.band{font-size:11px;border-radius:999px;padding:1px 8px;font-weight:500;white-space:nowrap;border:1px solid var(--line);color:var(--muted)}
.band.in{border-color:var(--piste-green);color:var(--piste-green)}
.band.float{border-style:dashed}
.stay-meta{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--muted)}
.stay-meta b{color:var(--ink);font-weight:500}
.channels{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 14px;font-size:14px;align-items:baseline}
.channels .h{font-size:12px;letter-spacing:.06em;color:var(--muted)}
.channels .num{font-family:var(--f-data);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.channels .best{color:var(--piste-green);font-weight:600}
.sport{display:flex;flex-direction:column;gap:10px}
.sport + .sport{border-top:1px solid var(--line);padding-top:16px}
.act{display:flex;flex-direction:column;gap:3px}
.act .name{font-weight:700}
.act .meta{font-size:13px;color:var(--muted)}
.diff{display:inline-flex;align-items:center;gap:6px;font-size:12px;white-space:nowrap}
.diff i{width:10px;height:10px;display:inline-block}
.diff.easy i{background:var(--piste-green);border-radius:50%}
.diff.moderate i{background:var(--piste-blue)}
.diff.hard i{background:var(--piste-red);transform:rotate(45deg)}
.hike-rating{font-family:var(--f-data);font-variant-numeric:tabular-nums;white-space:nowrap}
.hike-rating small{color:var(--muted);font-weight:400}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:14px}

table.wide{min-width:780px}
table.wide td:first-child{min-width:120px}

</style>

<script>
/* europe-town-stay-finder 住宿对比页渲染器 v1
 * 读取页面里 <script type="application/json" id="stay-data"> 的 JSON，渲染成对比页。
 * 预算区间、每家的最低价渠道、表格里的最低价都自动计算。
 * 标了「html」的字段允许 <b> <a> <br> 等行内标签，其余字段按纯文本处理。
 */
(function () {
  "use strict";
  var app = document.getElementById("app") || document.body.appendChild(document.createElement("div"));

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function html(s) { return s == null ? "" : String(s); }
  function num(s) {
    if (typeof s === "number") return s;
    var m = String(s == null ? "" : s).replace(/,/g, ".").match(/\d+(\.\d+)?/);
    return m ? parseFloat(m[0]) : NaN;
  }
  function a(url, text) {
    return url ? '<a href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(text) + "</a>" : esc(text);
  }
  function list(items) {
    return items && items.length ? '<ul class="notes">' + items.map(function (x) { return "<li>" + html(x) + "</li>"; }).join("") + "</ul>" : "";
  }
  function fmt(v, cur) { return isNaN(v) ? "—" : (Math.round(v * 100) / 100) + cur; }

  function render(d) {
    var cur = (d.budget && d.budget.currency) || "€";
    var B = d.budget ? num(d.budget.perNight) : NaN;
    var out = [];

    // 预算区间：×0.9–1.1 预算内；×0.8–0.9 / ×1.1–1.2 浮动
    function band(p) {
      if (isNaN(B) || isNaN(p)) return "";
      var r = p / B;
      if (r >= 0.9 && r <= 1.1) return '<span class="band in">预算内</span>';
      if (r >= 0.8 && r < 0.9) return '<span class="band float">低于预算 ' + Math.round((1 - r) * 100) + "%</span>";
      if (r > 1.1 && r <= 1.2) return '<span class="band float">超预算 ' + Math.round((r - 1) * 100) + "%</span>";
      if (r < 0.8) return '<span class="band">远低于预算</span>';
      return '<span class="band">超预算 ' + Math.round((r - 1) * 100) + "%</span>";
    }
    // 每家住宿：最低价渠道
    function cheapest(s) {
      var best = null;
      (s.prices || []).forEach(function (p) {
        var v = num(p.perNight);
        if (!isNaN(v) && (best === null || v < best.v)) best = { v: v, p: p };
      });
      return best;
    }

    // 页头
    var eyebrow = d.eyebrow || [d.town, d.dateLabel, d.nights ? d.nights + " 晚" : "", "第 " + (d.version || 1) + " 版"].filter(Boolean).join(" · ");
    out.push('<header><div class="eyebrow">' + esc(eyebrow) + "</div>");
    out.push("<h1>" + esc(d.heading || (d.town + " 及周边住宿")) + "</h1>");
    if (!isNaN(B)) {
      out.push('<div class="budget"><span>每晚预算 <b>' + fmt(B, cur) + "</b></span><span>预算内 <b>" + fmt(B * 0.9, cur) + "–" + fmt(B * 1.1, cur) +
        "</b></span><span>浮动区间 <b>" + fmt(B * 0.8, cur) + "–" + fmt(B * 1.2, cur) + "</b></span></div>");
    }
    if (d.intro) out.push('<p class="route-line">' + html(d.intro) + "</p>");
    out.push("</header>");

    // 结论
    if (d.verdict) {
      out.push('<div class="verdict"><h2>结论</h2>' + (d.verdict.items ? "<ul>" + d.verdict.items.map(function (x) { return "<li>" + html(x) + "</li>"; }).join("") + "</ul>" : ""));
      (d.verdict.alerts || (d.verdict.alert ? [d.verdict.alert] : [])).forEach(function (x) { out.push('<p class="alert">' + html(x) + "</p>"); });
      out.push("</div>");
    }

    // 公交 1 小时圈
    var towns = d.towns || [];
    if (towns.length) {
      out.push('<section><h2 class="sec">' + esc(d.townsTitle || "公交 1 小时圈") + '</h2><div class="scroll"><table class="wide"><thead><tr><th>村镇</th><th>到核心小镇</th><th>换乘</th><th>班次</th><th>末班回村</th><th>单程票价</th><th>游客卡 / 城市税</th></tr></thead><tbody>');
      towns.forEach(function (t) {
        out.push('<tr class="' + (t.core ? "core-row" : "") + '"><td>' + esc(t.name) + (t.core ? '<span class="core-mark">核心小镇</span>' : "") + "</td>" +
          '<td class="num">' + esc(t.core ? "—" : (t.time || "—")) + (t.mode && !t.core ? '<br><span class="small muted">' + esc(t.mode) + "</span>" : "") + "</td>" +
          '<td class="num">' + esc(t.core ? "—" : (t.transfers == null ? "—" : t.transfers)) + "</td>" +
          "<td>" + esc(t.freq || "—") + '</td><td class="num">' + esc(t.lastBack || "—") + '</td><td class="num">' + esc(t.fare || "—") + "</td>" +
          "<td>" + html(t.guestCard || "—") + (t.cityTax ? '<br><span class="small muted">城市税 ' + esc(t.cityTax) + "</span>" : "") + "</td></tr>");
      });
      out.push("</tbody></table></div>");
      if (d.townsNote) out.push('<p class="small muted" style="margin-top:8px">' + html(d.townsNote) + "</p>");
      out.push("</section>");
    }

    // 住宿总览表
    var stays = d.stays || [];
    if (stays.length) {
      var mins = stays.map(function (s) { var c = cheapest(s); return c ? c.v : NaN; });
      var lowest = Math.min.apply(null, mins.filter(function (v) { return !isNaN(v); }));
      out.push('<section><h2 class="sec">' + esc(d.staysTitle || "住宿总览") + '</h2><div class="scroll"><table class="wide"><thead><tr><th>#</th><th>住宿</th><th>村镇</th><th>房型</th><th>评分</th><th>到车站</th><th>每晚最低</th><th>在哪订</th></tr></thead><tbody>');
      stays.forEach(function (s, i) {
        var c = cheapest(s);
        var ratings = (s.prices || []).filter(function (p) { return p.rating; }).map(function (p) { return p.channel + " " + p.rating; });
        out.push('<tr><td class="num">' + (i + 1) + "</td><td>" + esc(s.name) + "</td><td>" + esc(s.town) + "</td><td>" + esc(s.type || "—") + '</td><td class="num">' + esc(ratings.join(" / ") || "—") +
          "</td><td>" + esc(s.walk || "—") + '</td><td class="num' + (c && c.v === lowest ? " best" : "") + '">' + (c ? fmt(c.v, cur) : "—") + "<br>" + (c ? band(c.v) : "") +
          "</td><td>" + (c ? esc(c.p.channel) : "—") + "</td></tr>");
      });
      out.push("</tbody></table></div>");
      if (d.staysNote) out.push('<p class="small muted" style="margin-top:8px">' + html(d.staysNote) + "</p>");
      out.push("</section>");

      // 每家住宿的卡片
      stays.forEach(function (s, i) {
        var c = cheapest(s);
        out.push('<section class="route" id="stay-' + (i + 1) + '"><div class="route-head"><div style="display:flex;flex-direction:column;gap:4px">' +
          (s.tag ? '<span class="pick">' + esc(s.tag) + "</span>" : "") + "<h3>" + (i + 1) + " · " + esc(s.name) + '</h3></div><div class="total">' +
          (c ? fmt(c.v, cur) + '<span class="small muted" style="font-family:var(--f-body);font-weight:400"> /晚</span>' : "—") + "</div></div>");
        var meta = [["村镇", s.town], ["房型", s.type], ["到车站", s.walk], ["到核心小镇", s.toCore], ["早餐", s.breakfast], ["取消", s.cancel]]
          .filter(function (m) { return m[1]; }).map(function (m) { return "<span>" + m[0] + " <b>" + esc(m[1]) + "</b></span>"; });
        if (meta.length) out.push('<div class="stay-meta">' + meta.join("") + "</div>");
        if (s.summary) out.push("<p>" + html(s.summary) + "</p>");
        if (s.prices && s.prices.length) {
          out.push('<div><div class="block-title">各渠道价格</div><div class="channels"><span class="h">渠道</span><span class="h num">评分</span><span class="h num">每晚 / 全程</span>');
          s.prices.forEach(function (p) {
            var v = num(p.perNight), isBest = c && v === c.v;
            out.push("<span>" + a(p.url, p.channel) + (p.note ? '<br><span class="small muted">' + html(p.note) + "</span>" : "") + '</span><span class="num">' + esc(p.rating || "—") +
              '</span><span class="num' + (isBest ? " best" : "") + '">' + fmt(v, cur) + (p.total != null ? " / " + fmt(num(p.total), cur) : "") + "</span>");
          });
          out.push("</div></div>");
        }
        out.push(list(s.notes));
        out.push("</section>");
      });
    }

    // 差点入选
    if (d.nearMiss && d.nearMiss.length) {
      out.push('<section class="excluded"><h2>差点入选</h2>' + d.nearMiss.map(function (n) {
        return '<div class="ex"><b>' + a(n.url, n.name) + (n.town ? '<span class="muted" style="font-weight:400"> · ' + esc(n.town) + "</span>" : "") +
          (n.price ? '<span class="muted" style="font-weight:400;font-family:var(--f-data)"> · ' + esc(n.price) + "</span>" : "") + "</b><span>" + html(n.why) + "</span></div>";
      }).join("") + "</section>");
    }

    // 户外运动与教练/团体
    if (d.activities && d.activities.length) {
      out.push('<section class="panel"><h2>' + esc(d.activitiesTitle || "户外运动与教练、团体") + "</h2>");
      d.activities.forEach(function (g) {
        out.push('<div class="sport"><h3>' + esc(g.sport) + "</h3>" + (g.note ? '<p class="small muted">' + html(g.note) + "</p>" : ""));
        (g.items || []).forEach(function (it) {
          var meta = [it.where, it.level, it.price, it.season, it.lang].filter(Boolean).map(esc).join(" · ");
          out.push('<div class="act"><span class="name">' + a(it.url, it.name) + (it.kind ? '<span class="muted" style="font-weight:400"> · ' + esc(it.kind) + "</span>" : "") + "</span>" +
            (meta ? '<span class="meta">' + meta + "</span>" : "") + (it.how ? '<span class="meta">' + html(it.how) + "</span>" : "") + "</div>");
        });
        out.push("</div>");
      });
      out.push("</section>");
    }

    // komoot 徒步路线
    if (d.hikes && d.hikes.length) {
      var dmap = { easy: "简单", moderate: "中等", hard: "困难" };
      out.push('<section><h2 class="sec">' + esc(d.hikesTitle || "komoot 高分徒步路线") + '</h2><div class="scroll"><table class="wide"><thead><tr><th>路线</th><th>评分（人数）</th><th>难度</th><th>距离 · 时长 · 爬升</th><th>起点和公交</th><th>季节</th></tr></thead><tbody>');
      d.hikes.forEach(function (h) {
        var dk = dmap[h.difficulty] ? h.difficulty : "moderate";
        out.push("<tr><td>" + a(h.url, h.name) + (h.area ? '<br><span class="small muted">' + esc(h.area) + "</span>" : "") + "</td>" +
          '<td class="hike-rating">' + esc(h.rating) + " <small>(" + esc(h.count) + ")</small></td>" +
          '<td><span class="diff ' + dk + '"><i></i>' + dmap[dk] + "</span></td>" +
          '<td class="num">' + [h.distance, h.duration, h.ascent ? "↑" + h.ascent : ""].filter(Boolean).map(esc).join(" · ") + "</td>" +
          "<td>" + html(h.start || "—") + "</td><td>" + html(h.season || "—") + "</td></tr>");
      });
      out.push("</tbody></table></div>");
      if (d.hikesNote) out.push('<p class="small muted" style="margin-top:8px">' + html(d.hikesNote) + "</p>");
      out.push("</section>");
    }

    // 排除的村镇 / 其他
    if (d.excluded && d.excluded.length) {
      out.push('<section class="excluded"><h2>' + esc(d.excludedTitle || "排除的村镇") + "</h2>" + d.excluded.map(function (e) {
        return '<div class="ex"><b>' + esc(e.name) + "</b><span>" + html(e.why) + "</span></div>";
      }).join("") + "</section>");
    }

    // 页脚
    var f = d.footer || {};
    out.push("<footer><p>查询时间：" + esc(d.queriedAt || "") + "。价格是查询时的快照，以平台为准。</p>");
    (f.paragraphs || []).forEach(function (p) { out.push("<p>" + html(p) + "</p>"); });
    if (f.links && f.links.length) {
      out.push("<ul>" + f.links.map(function (row) {
        return "<li>" + (Array.isArray(row) ? row : [row]).map(function (l) { return a(l.url, l.text); }).join(" · ") + "</li>";
      }).join("") + "</ul>");
    }
    out.push("</footer>");

    app.className = "wrap";
    app.innerHTML = out.join("");
    if (d.title) document.title = d.title;
  }

  try {
    var el = document.getElementById("stay-data");
    if (!el) throw new Error("页面里没有找到 id=\"stay-data\" 的 JSON。");
    render(JSON.parse(el.textContent));
  } catch (e) {
    app.className = "wrap";
    app.innerHTML = '<div class="render-error">住宿页渲染失败：' + esc(e.message) + "</div>";
  }
})();

</script>
</body>
</html>
